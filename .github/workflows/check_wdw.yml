name: WDW Reservation Checker

on:
  schedule:
    # 30分〜1時間ごとの定期実行（APIの無料枠節約のため）
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-reservation:
    runs-on: ubuntu-latest

    steps:
    - name: リポジトリのチェックアウト
      uses: actions/checkout@v4

    - name: Pythonのセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 依存ライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 監視スクリプトの実行
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        TARGET_DATE: "2026-11-29"
        PARTY_SIZE: "4"
      run: |
        python check_topolino.py
