name: WDW Reservation Checker

on:
  schedule:
    # 15分ごとに自動実行
    - cron: '*/15 * * * *'
  workflow_dispatch: # 手動実行ボタン用

jobs:
  check-reservation:
    runs-on: ubuntu-latest

    steps:
    - name: リポジトリのチェックアウト
      uses: actions/checkout@v4

    - name: Pythonのセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 依存ライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Playwrightブラウザのインストール
      run: |
        playwright install --with-deps chromium

    - name: 監視スクリプトの実行
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        TARGET_DATE: "2026-11-29"
        PARTY_SIZE: "4"
      run: |
        python check_topolino.py4
